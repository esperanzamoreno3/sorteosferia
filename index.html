<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ruleta Resucitado - Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #ffffff;
      text-align: center;
      background-color: #121212;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-image: linear-gradient(rgba(216, 27, 96, 0.85), rgba(136, 14, 79, 0.9)), url('IMG_5861.jpg');
    }

    .card {
      background: rgba(18, 18, 18, 0.94);
      border: 1px solid rgba(255, 215, 0, 0.35);
      border-radius: 24px;
      padding: 22px 18px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0,0,0,0.65);
      backdrop-filter: blur(10px);
    }

    .logo-header {
      width: 150px;
      max-width: 60%;
      margin: 0 auto 10px;
      display: block;
      border-radius: 12px;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
    }

    h1 {
      font-size: 1.65rem;
      margin-bottom: 4px;
      font-weight: 800;
      color: #ffd700;
      letter-spacing: 0.5px;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #eee;
      margin-bottom: 18px;
    }

    /* Ruleta */
    .wheel-container {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 0 auto 20px;
    }
    .pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 26px solid #ffd700;
      z-index: 10;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.8));
    }
    canvas {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), 0 0 0 5px #ffd700;
      display: block;
    }

    .btn {
      background: linear-gradient(135deg, #ffd700, #ff9800);
      color: #111;
      border: none;
      font-weight: 800;
      font-size: 1.15rem;
      padding: 14px 28px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(255, 152, 0, 0.4);
      transition: transform 0.1s ease;
      width: 100%;
      max-width: 260px;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn:disabled {
      background: #555;
      color: #888;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .result-box {
      margin-top: 20px;
      animation: fadeIn 0.4s ease forwards;
    }
    .badge {
      display: inline-block;
      font-weight: 800;
      padding: 10px 24px;
      border-radius: 50px;
      font-size: 1.25rem;
      margin: 12px 0 8px;
    }
    .badge-win {
      background: #ffd700;
      color: #111;
      border: 2px solid #fff;
    }

    .time-box {
      font-size: 1rem;
      font-weight: bold;
      color: #ffeb3b;
      margin-bottom: 12px;
      background: rgba(255, 235, 59, 0.12);
      padding: 6px 12px;
      border-radius: 8px;
      display: inline-block;
    }

    .rules {
      text-align: left;
      font-size: 0.85rem;
      background: rgba(255,255,255,0.08);
      padding: 14px;
      border-radius: 12px;
      line-height: 1.45;
      margin-top: 14px;
    }
    .rules li {
      margin-left: 18px;
      margin-bottom: 5px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="card" id="app">
  <img src="IMG_5861.jpg" alt="Caseta El Resucitado" class="logo-header">
  <h1>RULETA RESUCITADO</h1>
  <p class="subtitle">¡Prueba suerte y llévate descuentos en barra!</p>

  <div class="wheel-container">
    <div class="pointer"></div>
    <canvas id="wheel" width="560" height="560"></canvas>
  </div>

  <button class="btn" id="spinBtn" onclick="girarRuleta()">¡PROBAR SUERTE!</button>

  <div id="resultado"></div>
</div>

<script>
  // Sectores de la ruleta (en este modo especial siempre caerá en uno de los premios)
  const sectores = [
    { text: "-1,50€ CUBATA", color: "#d81b60", type: "dto_cubata" },
    { text: "SUERTE", color: "#37474f", type: "nada" },
    { text: "-1,00€ REBUJITO", color: "#0288d1", type: "dto_rebujito" },
    { text: "SUERTE", color: "#263238", type: "nada" },
    { text: "1 CHUPITO", color: "#2e7d32", type: "chupito" },
    { text: "SUERTE", color: "#37474f", type: "nada" },
    { text: "-1,00€ REBUJITO", color: "#0288d1", type: "dto_rebujito" },
    { text: "SUERTE", color: "#263238", type: "nada" }
  ];

  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");
  const numSectores = sectores.length;
  const arcSize = (2 * Math.PI) / numSectores;
  let rotationOffset = 0;
  let isSpinning = false;

  function drawWheel() {
    const cx = 280, cy = 280, r = 265;
    ctx.clearRect(0, 0, 560, 560);

    for (let i = 0; i < numSectores; i++) {
      const angle = rotationOffset + i * arcSize;
      ctx.beginPath();
      ctx.fillStyle = sectores[i].color;
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, angle, angle + arcSize);
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#ffd700";
      ctx.stroke();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle + arcSize / 2);
      ctx.textAlign = "right";
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 23px sans-serif";
      ctx.shadowColor = "rgba(0,0,0,0.85)";
      ctx.shadowBlur = 6;
      ctx.fillText(sectores[i].text, r - 22, 8);
      ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(cx, cy, 36, 0, 2 * Math.PI);
    ctx.fillStyle = "#ffd700";
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = "#ffffff";
    ctx.stroke();
  }

  drawWheel();

  const resultadoDiv = document.getElementById("resultado");
  const spinBtn = document.getElementById("spinBtn");
  let contadorDemo = 1;

  function girarRuleta() {
    if (isSpinning) return;
    isSpinning = true;
    spinBtn.disabled = true;
    resultadoDiv.innerHTML = "";

    // Para el vídeo: siempre elige uno de los premios (excluye "nada")
    const premiosDisponibles = ["dto_cubata", "dto_rebujito", "chupito"];
    const targetType = premiosDisponibles[Math.floor(Math.random() * premiosDisponibles.length)];

    const matchingIndices = [];
    sectores.forEach((sec, idx) => {
      if (sec.type === targetType) matchingIndices.push(idx);
    });
    const selectedSector = matchingIndices[Math.floor(Math.random() * matchingIndices.length)];

    const targetAngleAtPointer = (3 * Math.PI) / 2;
    const sectorCenterAngle = selectedSector * arcSize + arcSize / 2;
    let targetOffset = targetAngleAtPointer - sectorCenterAngle;
    while (targetOffset < 0) targetOffset += 2 * Math.PI;

    const vueltasCompletas = 5 * 2 * Math.PI;
    const finalOffset = vueltasCompletas + targetOffset;

    const duracion = 4000;
    const start = performance.now();

    function animate(time) {
      const elapsed = time - start;
      const progress = Math.min(elapsed / duracion, 1);
      const ease = 1 - Math.pow(1 - progress, 3);

      rotationOffset = ease * finalOffset;
      drawWheel();

      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        isSpinning = false;
        spinBtn.disabled = false; // Se vuelve a habilitar inmediatamente para poder repetir la toma
        spinBtn.textContent = "¡GIRAR DE NUEVO!";
        mostrarPremio(targetType);
      }
    }

    requestAnimationFrame(animate);
  }

  function mostrarPremio(tipo) {
    let titulo = "";
    let detalle = "";

    if (tipo === "dto_cubata") {
      titulo = "🍹 ¡1,50€ DE DESCUENTO EN CUBATA! 🍹";
      detalle = "Descuento de 1,50 € en tu cubata al pedir en caja.";
    } else if (tipo === "dto_rebujito") {
      titulo = "🌿 ¡1,00€ DE DESCUENTO EN REBUJITO! 🌿";
      detalle = "Descuento de 1,00 € en tu vaso/jarra de rebujito al pedir en caja.";
    } else {
      titulo = "🥃 ¡CHUPITO DE REGALO! 🥃";
      detalle = "Un chupito gratis al pedir tu consumición.";
    }

    resultadoDiv.innerHTML = `
      <div class="result-box">
        <h2 style="font-size:1.3rem; color:#ffd700; margin-bottom:4px;">${titulo}</h2>
        <div class="badge badge-win">PREMIO ${contadorDemo++}</div>
        <br>
        <div class="time-box">📅 Válido durante todo el día de hoy</div>
        
        <div class="rules">
          <strong>Cómo canjear en El Resucitado:</strong>
          <ul>
            <li>${detalle}</li>
            <li>Enseña esta pantalla en <strong>CAJA</strong> para aplicar la promoción.</li>
            <li>Válido exclusivamente durante el día de hoy.</li>
          </ul>
        </div>
      </div>
    `;
  }
</script>

</body>
</html>
