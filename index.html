<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ruleta Resucitado</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #ffffff;
      text-align: center;
      background-color: #121212;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      transition: background 0.4s ease;
    }

    /* Tinte y foto según el día (Martes: Fucsia / Miércoles: Verde) */
    body.martes {
      background-image: linear-gradient(rgba(216, 27, 96, 0.85), rgba(136, 14, 79, 0.9)), url('IMG_5861.jpg');
    }
    body.miercoles {
      background-image: linear-gradient(rgba(0, 137, 123, 0.85), rgba(0, 77, 64, 0.9)), url('IMG_5861.jpg');
    }
    /* Resto de días (modo prueba con fondo oscuro + foto) */
    body.default-day {
      background-image: linear-gradient(rgba(18, 18, 18, 0.85), rgba(0, 0, 0, 0.9)), url('IMG_5861.jpg');
    }

    .card {
      background: rgba(18, 18, 18, 0.92);
      border: 1px solid rgba(255, 215, 0, 0.35);
      border-radius: 24px;
      padding: 22px 18px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0,0,0,0.65);
      backdrop-filter: blur(10px);
    }

    .logo-header {
      width: 150px;
      max-width: 60%;
      margin: 0 auto 10px;
      display: block;
      border-radius: 12px;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
    }

    h1 {
      font-size: 1.7rem;
      margin-bottom: 4px;
      font-weight: 800;
      color: #ffd700;
      letter-spacing: 0.5px;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #eee;
      margin-bottom: 18px;
    }

    /* Contenedor Ruleta */
    .wheel-container {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 0 auto 20px;
    }
    .pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 26px solid #ffd700;
      z-index: 10;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.8));
    }
    canvas {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), 0 0 0 5px #ffd700;
      display: block;
    }

    .btn {
      background: linear-gradient(135deg, #ffd700, #ff9800);
      color: #111;
      border: none;
      font-weight: 800;
      font-size: 1.15rem;
      padding: 14px 28px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(255, 152, 0, 0.4);
      transition: transform 0.1s ease;
      width: 100%;
      max-width: 260px;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn:disabled {
      background: #555;
      color: #888;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .result-box {
      margin-top: 20px;
      animation: fadeIn 0.4s ease forwards;
    }
    .badge {
      display: inline-block;
      font-weight: 800;
      padding: 8px 18px;
      border-radius: 50px;
      font-size: 1.1rem;
      margin: 12px 0 8px;
    }
    .badge-win { background: #ffd700; color: #111; }
    .badge-lose { background: #333; color: #eee; }

    .time-box {
      font-size: 1.05rem;
      font-weight: bold;
      color: #ffeb3b;
      margin-bottom: 12px;
    }

    .rules {
      text-align: left;
      font-size: 0.85rem;
      background: rgba(255,255,255,0.08);
      padding: 14px;
      border-radius: 12px;
      line-height: 1.45;
      margin-top: 14px;
    }
    .rules li {
      margin-left: 18px;
      margin-bottom: 5px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="card" id="app">
  <img src="IMG_5861.jpg" alt="Caseta El Resucitado" class="logo-header">
  <h1>RULETA RESUCITADO</h1>
  <p class="subtitle">¡Prueba suerte en la caseta y llévate premio!</p>

  <div class="wheel-container">
    <div class="pointer"></div>
    <canvas id="wheel" width="560" height="560"></canvas>
  </div>

  <button class="btn" id="spinBtn" onclick="girarRuleta()">¡PROBAR SUERTE!</button>

  <div id="resultado"></div>
</div>

<script>
  // 1. Detección automática del día
  const dia = new Date().getDay(); // 2 = Martes, 3 = Miércoles
  if (dia === 2) {
    document.body.classList.add('martes');
  } else if (dia === 3) {
    document.body.classList.add('miercoles');
  } else {
    document.body.classList.add('default-day');
  }

  // 2. Sectores visuales de la ruleta
  const sectores = [
    { text: "CUBATAS", color: "#d81b60", type: "cubata" },
    { text: "SUERTE", color: "#37474f", type: "nada" },
    { text: "REBUJITO", color: "#0288d1", type: "rebujito" },
    { text: "SUERTE", color: "#263238", type: "nada" },
    { text: "CHUPITO", color: "#2e7d32", type: "chupito" },
    { text: "SUERTE", color: "#37474f", type: "nada" },
    { text: "REBUJITO", color: "#0288d1", type: "rebujito" },
    { text: "SUERTE", color: "#263238", type: "nada" }
  ];

  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");
  const numSectores = sectores.length;
  const arcSize = (2 * Math.PI) / numSectores;
  let rotationOffset = 0;
  let isSpinning = false;

  function drawWheel() {
    const cx = 280, cy = 280, r = 265;
    ctx.clearRect(0, 0, 560, 560);

    for (let i = 0; i < numSectores; i++) {
      const angle = rotationOffset + i * arcSize;
      ctx.beginPath();
      ctx.fillStyle = sectores[i].color;
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, angle, angle + arcSize);
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#ffd700";
      ctx.stroke();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle + arcSize / 2);
      ctx.textAlign = "right";
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 25px sans-serif";
      ctx.shadowColor = "rgba(0,0,0,0.85)";
      ctx.shadowBlur = 6;
      ctx.fillText(sectores[i].text, r - 25, 9);
      ctx.restore();
    }

    // Botón central dorado
    ctx.beginPath();
    ctx.arc(cx, cy, 36, 0, 2 * Math.PI);
    ctx.fillStyle = "#ffd700";
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = "#ffffff";
    ctx.stroke();
  }

  drawWheel();

  // 3. Comprobación de bloqueo de 60 minutos
  const COOLDOWN = 60 * 60 * 1000;
  const ultimo = localStorage.getItem("ultimo_tiro_resucitado");
  const ahora = Date.now();
  const resultadoDiv = document.getElementById("resultado");
  const spinBtn = document.getElementById("spinBtn");

  if (ultimo && (ahora - parseInt(ultimo)) < COOLDOWN) {
    const restante = Math.ceil((COOLDOWN - (ahora - parseInt(ultimo))) / 60000);
    spinBtn.disabled = true;
    spinBtn.textContent = "BLOQUEADO";
    resultadoDiv.innerHTML = `
      <div class="result-box">
        <div class="badge badge-lose">⏳ Ya has probado suerte</div>
        <p style="color:#bbb; font-size:0.95rem; margin-top:6px;">
          Solo se permite 1 tirada cada 60 minutos por persona.<br>
          Podrás volver a girar en <strong>${restante} minutos</strong>.
        </p>
      </div>
    `;
  }

  // 4. Lógica de sorteo (100 intentos: 1 cubata, 2 rebujitos, 3 chupitos, 94 nada)
  function girarRuleta() {
    if (isSpinning) return;
    isSpinning = true;
    spinBtn.disabled = true;
    resultadoDiv.innerHTML = "";

    localStorage.setItem("ultimo_tiro_resucitado", Date.now());

    const suerte = Math.floor(Math.random() * 100);
    let targetType = "nada";

    if (suerte === 0) targetType = "cubata";        // 1 de cada 100
    else if (suerte <= 2) targetType = "rebujito";  // 2 de cada 100
    else if (suerte <= 5) targetType = "chupito";   // 3 de cada 100

    const matchingIndices = [];
    sectores.forEach((sec, idx) => {
      if (sec.type === targetType) matchingIndices.push(idx);
    });
    const selectedSector = matchingIndices[Math.floor(Math.random() * matchingIndices.length)];

    const targetAngleAtPointer = (3 * Math.PI) / 2;
    const sectorCenterAngle = selectedSector * arcSize + arcSize / 2;
    let targetOffset = targetAngleAtPointer - sectorCenterAngle;
    while (targetOffset < 0) targetOffset += 2 * Math.PI;

    const vueltasCompletas = 5 * 2 * Math.PI;
    const finalOffset = vueltasCompletas + targetOffset;

    const duracion = 4500;
    const start = performance.now();

    function animate(time) {
      const elapsed = time - start;
      const progress = Math.min(elapsed / duracion, 1);
      const ease = 1 - Math.pow(1 - progress, 3);

      rotationOffset = ease * finalOffset;
      drawWheel();

      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        isSpinning = false;
        mostrarPremio(targetType);
      }
    }

    requestAnimationFrame(animate);
  }

  // 5. Mostrar premio y normas
  function mostrarPremio(tipo) {
    const fin = new Date(Date.now() + 15 * 60 * 1000);
    const horaStr = fin.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    const ticketId = Math.floor(1000 + Math.random() * 9000);

    if (tipo === "nada") {
      resultadoDiv.innerHTML = `
        <div class="result-box">
          <div class="badge badge-lose">😢 ¡NO HUBO SUERTE!</div>
          <p style="color:#ddd; margin-top:8px;">Lo sentimos, esta vez no te ha tocado nada.</p>
          <p style="color:#aaa; font-size:0.85rem; margin-top:4px;">Podrás volver a probar dentro de 60 minutos.</p>
        </div>
      `;
    } else {
      let titulo = "";
      let detalle = "";

      if (tipo === "cubata") {
        titulo = "🎉 ¡HORA FELIZ DE CUBATAS! 🎉";
        detalle = "Cubatas a precio reducido (máximo 4 consumiciones).";
      } else if (tipo === "rebujito") {
        titulo = "🌿 ¡PREMIO DE REBUJITO! 🌿";
        detalle = "Rebujito a precio especial de caseta.";
      } else if (tipo === "chupito") {
        titulo = "🥃 ¡CHUPITO DE REGALO! 🥃";
        detalle = "Canjea un chupito gratis al pedir en caja.";
      }

      resultadoDiv.innerHTML = `
        <div class="result-box">
          <h2 style="font-size:1.35rem; color:#ffd700; margin-bottom:4px;">${titulo}</h2>
          <div class="badge badge-win">TICKET #${ticketId}</div>
          <div class="time-box">Válido hasta las ${horaStr}</div>
          
          <div class="rules">
            <strong>Cómo canjear en El Resucitado:</strong>
            <ul>
              <li>${detalle}</li>
              <li>Enseña esta pantalla de inmediato en la <strong>CAJA</strong>.</li>
              <li>Válido únicamente hasta las <strong>${horaStr}</strong>.</li>
            </ul>
          </div>
        </div>
      `;
    }
  }
</script>

</body>
</html>
